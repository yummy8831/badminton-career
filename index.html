<style>
:root{--bg:#071b2d;--panel:#102b42;--panel2:#163750;--line:#2c5068;--text:#eef7ff;--muted:#9bb7ca;--lime:#c9f45b;--blue:#58c5ff;--red:#ff7b83;--gold:#ffd36b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#17415b 0,#071b2d 45%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:auto;padding:0 14px 100px}header{padding:24px 4px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;line-height:1.1;margin:0}h1 span{color:var(--lime)}.sub{font-size:12px;color:var(--muted);margin-top:6px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--lime);font-size:12px;white-space:nowrap}.hero{background:linear-gradient(135deg,#1d4962,#10283d);border:1px solid #315770;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #0002}.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.name{font-size:20px;font-weight:800}.rank{color:var(--lime);font-size:13px;margin-top:4px}.money{font-size:22px;font-weight:800;color:var(--gold)}.small{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:17px}.stat{background:#071b2d80;padding:10px 7px;border-radius:12px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.bar{height:6px;background:#28465a;border-radius:10px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--lime);border-radius:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,var(--panel),#0d2538);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px}.card h2{font-size:15px;margin:0 0 10px}.card p{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h2{font-size:17px;margin:0}.section-title span{font-size:11px;color:var(--muted)}button{font:inherit;cursor:pointer;border:0}.action{width:100%;padding:12px 10px;border-radius:12px;background:var(--panel2);border:1px solid #315770;color:var(--text);text-align:left;min-height:78px}.action strong{display:block;font-size:13px;margin-bottom:4px}.action span{font-size:11px;color:var(--muted);display:block;line-height:1.35}.action:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--lime);color:#14220b;font-weight:800;text-align:center;border:0}.secondary{background:#183b52;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px 12px}.wide{width:100%;margin-top:10px;padding:13px}.tournament{display:flex;gap:12px;align-items:center}.cup{width:43px;height:43px;border-radius:13px;background:#294c5d;display:grid;place-items:center;font-size:22px;flex-shrink:0}.tour-info{flex:1}.tour-info strong{font-size:13px}.tour-info small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tag{font-size:10px;padding:5px 7px;border-radius:7px;background:#243f50;color:var(--gold);white-space:nowrap}.log{font-size:12px;line-height:1.6;color:#c2d6e5}.log div{padding:8px 0;border-bottom:1px solid #254257}.log div:last-child{border:0}.equipment{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #254257}.equipment:last-child{border:0}.equipment strong{font-size:12px}.equipment small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#071b2df2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;gap:8px}.bottom button{flex:1}.notice{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#eaffb4;color:#17250a;padding:10px 16px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:0 5px 25px #0005;display:none;z-index:9;max-width:90%}.modal{position:fixed;inset:0;background:#020b12c9;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalbox{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.modalbox h2{margin:0 0 10px;font-size:19px}.modalbox p{color:var(--muted);font-size:13px;line-height:1.6}.modalbox .result{font-size:30px;font-weight:900;color:var(--lime);text-align:center;margin:15px 0}.footnote{text-align:center;font-size:10px;color:#6f92a9;margin:20px 0}.health-good{color:var(--lime)}.health-bad{color:var(--red)}@media(min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(4,1fr)}}
.pixel-card{background:linear-gradient(180deg,#111e30,#0a1524);border:1px solid #2c4059;border-radius:17px;padding:10px;margin-bottom:14px;overflow:hidden}.pixel-card h2{font-size:15px;margin:4px 4px 8px}.pixel-card p{font-size:11px;color:var(--muted);margin:0 4px 10px;line-height:1.5}.pixel-art{display:block;width:100%;height:auto;border-radius:10px;border:1px solid #34465c;image-rendering:pixelated}.version-badge{display:inline-block;margin-left:6px;border-radius:6px;background:#243e52;color:#c9f45b;padding:3px 6px;font-size:10px;vertical-align:middle}@media(min-width:540px){.pixel-card{padding:14px}}
